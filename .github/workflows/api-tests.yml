name: API tests

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/api-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # SQL Server จริงสำหรับ test ระบบวัสดุ (แทน LocalDB ที่มีแค่บน Windows)
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Test_Passw0rd!'   # ใช้เฉพาะ container ชั่วคราวใน CI
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      TEST_SQL_SERVER: 'Server=localhost,1433;User Id=sa;Password=Test_Passw0rd!;TrustServerCertificate=True'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test backend/APi.Tests --configuration Release --logger "console;verbosity=normal"
