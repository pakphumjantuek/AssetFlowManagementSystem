<app-data-table
  title="เอกสารการจัดซื้อจัดจ้างของโครงการ"
  subtitle="เลือกเอกสารเพื่อดูรายละเอียดหรือรายการครุภัณฑ์ วัสดุ และงานจ้าง (คลิกที่สถานะเพื่อเปลี่ยน)"
  [data]="procurementrecords()"
  [columns]="columns"
  [clickableColumns]="['document_no']"
  [clickableBadgeColumns]="['status']"
  [badgeColors]="badgeColors"
  [idKey]="'procurement_record_id'"
  [isAdmin]="true"
  [showDelete]="false"
  [sortOptions]="sortOptions"
  [filterOptions]="filterOptions()"
  [totalItems]="procurementrecord?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (filterChange)="onFilterChange($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  [fileBaseUrl]="baseFileUrl"
  (action)="onTableAction($event)"
  [Namepath]="'ดูรายการ'"
  (back)="cancel()"
  [showPathTo]="true"
  [showDetail]="true"
  [showBack]="true"
></app-data-table>
