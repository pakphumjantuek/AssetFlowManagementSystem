<div class="min-h-screen bg-slate-100 px-4 py-6 font-sans sm:px-6 lg:px-8">
  <div class="mx-auto max-w-[1920px]">
    <button
      type="button"
      (click)="cancel()"
      class="mb-4 inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-sm font-bold text-slate-800 shadow-sm transition hover:border-orange-600 hover:bg-orange-50 hover:text-orange-900"
    >
      <span class="text-lg leading-none">←</span>
      กลับไปหน้ารายการ
    </button>

    <div class="grid gap-5">
      <div class="overflow-hidden rounded-xl border border-slate-300 bg-white shadow-sm">
        <div class="border-b-2 border-orange-800 border-l-[6px] border-l-orange-300 bg-orange-700 px-6 py-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h2 class="text-xl font-bold text-white">{{ title() }}</h2>
            <span
              class="inline-flex w-fit items-center rounded-full px-3.5 py-1 text-sm font-bold"
              [ngClass]="
                isEditMode()
                  ? 'bg-amber-100 text-amber-900 ring-1 ring-amber-400'
                  : 'bg-white text-orange-900 ring-1 ring-orange-300'
              "
            >
              {{ isEditMode() ? 'โหมดแก้ไข' : 'โหมดเพิ่มข้อมูล' }}
            </span>
          </div>
          <p class="mt-1 text-sm text-white">กรอกข้อมูลที่จำเป็นให้ครบถ้วนก่อนบันทึก (ช่องที่มีเครื่องหมาย * จำเป็นต้องกรอก)</p>
        </div>

        @if (isLoading()) {
          <div class="space-y-4 p-6">
            <div class="h-4 w-40 animate-pulse rounded bg-slate-200"></div>
            <div class="h-11 w-full animate-pulse rounded-lg bg-slate-200"></div>
            <div class="h-10 w-48 animate-pulse rounded-lg bg-slate-200"></div>
          </div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="submit()">
            <section class="border-b border-slate-200">
              <div class="flex items-center gap-3 border-b border-orange-200 bg-orange-50 px-6 py-2.5">
                <span class="flex h-7 w-7 items-center justify-center rounded-md bg-orange-700 text-sm font-bold text-white">1</span>
                <h3 class="text-base font-bold text-orange-950">ข้อมูลการแจ้งซ่อม</h3>
              </div>
              <div class="grid grid-cols-1 gap-6 p-6 md:grid-cols-3">
                <app-input
                  label="เลขฎีกา *"
                  [control]="form.controls.decree_document_no"
                  placeholder="เช่น ฎีกา กค 1234/2565"
                  [required]="true"
                ></app-input>
                <app-date-picker
                  label="วันที่ซ่อม"
                  [control]="form.controls.repair_date"
                  [showCalendarIcon]="true"
                />
                <app-select
                  label="ผู้รับผิดชอบ"
                  [control]="form.controls.staff_id"
                  [options]="staffOptions()"
                  optionLabel="full_name"
                  optionValue="staff_id"
                  placeholder="เลือกผู้รับผิดชอบ"
                />
              </div>
              <div class="px-6 pb-6">
                <app-textarea
                  label="รายละเอียดปัญหา"
                  [control]="form.controls.problem_description"
                  placeholder="เช่น เครื่องคอมพิวเตอร์ไม่สามารถเปิดใช้งานได้"
                ></app-textarea>
              </div>
            </section>

            <section>
              <div class="flex items-center gap-3 border-b border-orange-200 bg-orange-50 px-6 py-2.5">
                <span class="flex h-7 w-7 items-center justify-center rounded-md bg-orange-700 text-sm font-bold text-white">2</span>
                <h3 class="text-base font-bold text-orange-950">ผู้ซ่อมและค่าใช้จ่าย</h3>
              </div>
              <div class="grid grid-cols-1 gap-6 p-6 md:grid-cols-3">
                <app-select
                  label="ร้าน/บริษัทที่ซ่อม"
                  [control]="form.controls.vendor_id"
                  [options]="vendors()"
                  optionLabel="vendor_name"
                  optionValue="vendor_id"
                  placeholder="-- เลือกบริษัท/ร้าน --"
                  [showNotFoundAction]="true"
                  [notFoundActionLabel]="'+ เพิ่มบริษัทนี้'"
                  (notFoundAction)="openVendorQuickCreate($event)"
                />
                <app-input
                  label="จำนวนเงิน (บาท)"
                  [control]="form.controls.repair_cost"
                  placeholder="เช่น 1,500.00"
                  type="number"
                ></app-input>
                <app-select
                  label="สถานะ"
                  [control]="form.controls.status"
                  [options]="statusOptions"
                  optionLabel="label"
                  optionValue="value"
                  [searchable]="false"
                  [clearable]="false"
                />
              </div>
            </section>

            <div
              class="flex flex-col-reverse gap-3 border-t border-slate-300 bg-slate-50 px-6 py-4 sm:flex-row sm:items-center sm:justify-end"
            >
              <button
                type="button"
                (click)="cancel()"
                class="inline-flex justify-center rounded-lg border border-slate-400 bg-white px-5 py-2.5 text-sm font-bold text-slate-800 shadow-sm transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
                [disabled]="isSubmitting()"
              >
                ยกเลิก
              </button>

              <button
                type="submit"
                class="inline-flex justify-center rounded-lg border border-orange-900 bg-orange-700 px-6 py-2.5 text-sm font-bold text-white shadow-sm transition hover:bg-orange-800 disabled:cursor-not-allowed disabled:opacity-50"
                [disabled]="isSubmitting() || form.invalid"
              >
                @if (isSubmitting()) {
                  กำลังบันทึก...
                } @else if (isEditMode()) {
                  บันทึกการแก้ไข
                } @else {
                  บันทึกข้อมูล
                }
              </button>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</div>

<app-procurement-vendor-quick-create-modal
  [isOpen]="isVendorModalOpen()"
  [isSubmitting]="isCreatingVendor()"
  [initialVendorName]="pendingVendorName()"
  (close)="closeVendorQuickCreate()"
  (save)="createVendorQuick($event)"
/>
